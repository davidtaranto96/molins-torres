<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edificio La Torre — Balcarce y Aniceto Latorre, Salta</title>
<meta name="robots" content="noindex, nofollow">
<!--
  PORTADA NUEVA — prototipo. No enlazada, con noindex.

  Replica la MECÁNICA de la referencia (belgradearbor.rs): el hero que se arma
  de un boceto al ritmo del scroll, el scroll suave, los títulos que entran
  partidos, las secciones con parallax, las solapas de tipología, el 3D con
  hora del día embebido. El diseño, el copy y la tipografía son propios: la
  identidad que ya tiene La Torre.

  Reglas del estudio que se respetan acá: HTML/CSS/JS plano, sin framework;
  GSAP y Lenis entran por CDN como librerías; tokens en :root; mobile first;
  un solo aviso de cookies con consentimiento por navegación; todo el texto
  visible sale del diccionario de app.js (ES/EN/PT), nunca del HTML.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=202609031422">
</head>
<body data-idioma="es">

<div id="intro" aria-hidden="true">
  <div class="intro-num"><span id="intro-pct">0</span>%</div>
  <div class="intro-marca">LA TORRE</div>
</div>

<header class="cab">
  <a href="#inicio" class="cab-marca" data-t="marca">LA TORRE</a>
  <nav class="cab-nav" aria-label="Secciones">
    <a href="#diseno" data-t="nav.diseno"></a>
    <a href="#tipologias" data-t="nav.tipologias"></a>
    <a href="#unidades" data-t="nav.unidades"></a>
    <a href="#tresd" data-t="nav.tresd"></a>
    <a href="#ubicacion" data-t="nav.ubicacion"></a>
    <a href="#contacto" data-t="nav.contacto"></a>
  </nav>
  <div class="cab-der">
    <div class="idiomas" role="group" aria-label="Idioma">
      <button type="button" data-idioma-btn="es" aria-pressed="true">ES</button>
      <button type="button" data-idioma-btn="en" aria-pressed="false" hidden>EN</button>
      <button type="button" data-idioma-btn="pt" aria-pressed="false" hidden>PT</button>
    </div>
    <a href="#unidades" class="boton boton-lleno cab-cta" data-t="cta.elegir"></a>
    <button class="hamb" type="button" aria-expanded="false" aria-label="Abrir el menú"><span></span><span></span></button>
  </div>
</header>

<main>

  <!-- ══ HERO: del boceto al render ══ -->
  <section id="inicio" class="hero" data-screen-label="Portada">
    <div class="hero-fijo">
      <img class="hero-render" src="../../img/hero-cover.jpg" alt="Edificio La Torre sobre Balcarce y Aniceto Latorre, Salta" fetchpriority="high">
      <canvas class="hero-boceto" aria-hidden="true"></canvas>
      <div class="hero-velo"></div>
      <div class="hero-texto">
        <p class="rotulo rotulo-claro hero-rotulo" data-t="hero.rotulo"></p>
        <h1 class="hero-titulo" aria-label="La Torre"><span class="letra">L</span><span class="letra">A</span><span class="letra esp">&nbsp;</span><span class="letra">T</span><span class="letra">O</span><span class="letra">R</span><span class="letra">R</span><span class="letra">E</span></h1>
        <p class="hero-bajada" data-t="hero.bajada"></p>
        <div class="hero-ctas">
          <a href="#unidades" class="boton boton-lleno" data-t="cta.elegir"></a>
          <a href="#vida" class="boton boton-linea" data-t="cta.visita"></a>
        </div>
      </div>
      <div class="hero-pista" data-t="hero.pista"></div>
    </div>
  </section>

  <!-- ══ MANIFIESTO ══ -->
  <section class="manifiesto" data-screen-label="Manifiesto">
    <p class="manifiesto-texto partir" data-t="intro.titulo"></p>
    <p class="manifiesto-datos" data-t="intro.datos"></p>
  </section>

  <!-- ══ DISEÑO: fondo oscuro, texto grande y fotos en formas orgánicas ══ -->
  <section id="diseno" class="diseno" data-screen-label="Diseño">
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <defs>
        <clipPath id="blob-a" clipPathUnits="objectBoundingBox"><path d="M.52.02C.7.01.9.1.96.3.99.44.97.6.9.72.82.86.66.98.48.99.3 1 .12.9.05.74-.03.58.02.38.1.24.18.1.34.03.52.02Z"/></clipPath>
        <clipPath id="blob-b" clipPathUnits="objectBoundingBox"><path d="M.46.03C.62 0 .8.06.9.2.99.34 1 .5.95.66.9.82.76.96.58.99.4 1 .2.94.1.8.01.66-.01.48.05.32.11.18.28.06.46.03Z"/></clipPath>
      </defs>
    </svg>
    <div class="diseno-grid">
      <div class="diseno-texto">
        <p class="rotulo rotulo-claro" data-t="diseno.rotulo"></p>
        <h2 class="diseno-titulo partir" data-t="diseno.titulo"></h2>
        <p class="parrafo parrafo-claro" data-t="diseno.texto"></p>
        <ul class="lista-materiales lista-clara">
          <li data-t="diseno.m1"></li><li data-t="diseno.m2"></li><li data-t="diseno.m3"></li><li data-t="diseno.m4"></li>
        </ul>
        <a href="#tresd" class="boton boton-claro" data-t="diseno.cta"></a>
      </div>
      <div class="diseno-fotos">
        <figure class="blob blob-1 parallax-lento"><img src="../../img/render-interior.jpg" alt="" loading="lazy"></figure>
        <figure class="blob blob-2 parallax"><img src="../../img/area-estar.jpg" alt="" loading="lazy"></figure>
      </div>
    </div>
  </section>

  <!-- ══ RESIDENCIAS: la lista de tipologías y la foto a pantalla ══ -->
  <section id="tipologias" class="residencias" data-screen-label="Tipologías">
    <div class="res-panel">
      <p class="rotulo" data-t="tipologias.rotulo"></p>
      <ul class="res-lista" id="res-lista" role="tablist" aria-label="Tipologías"></ul>
      <div class="res-ficha">
        <p class="res-desc" id="res-desc"></p>
        <p class="res-amb" id="res-amb"></p>
        <p class="res-ubic" id="res-ubic"></p>
      </div>
      <div class="res-pie">
        <div class="res-contador"><b id="res-libres">—</b><span data-t="tipologias.disponibles"></span></div>
        <div class="res-acciones">
          <button type="button" class="boton boton-linea" id="res-lamina-btn" data-t="tipologias.verLamina"></button>
          <a href="#contacto" class="boton boton-lleno" id="res-consultar" data-t="cta.consultar"></a>
        </div>
      </div>
    </div>
    <div class="res-foto">
      <img id="res-img-a" alt="" class="res-img activa">
      <img id="res-img-b" alt="" class="res-img">
      <div class="res-velo"></div>
      <div class="res-palabra" data-t="tipologias.palabra"></div>
      <div class="res-flechas">
        <button type="button" id="res-prev" aria-label="Tipología anterior">←</button>
        <button type="button" id="res-next" aria-label="Tipología siguiente">→</button>
      </div>
      <figure class="res-lamina" id="res-lamina" hidden>
        <img id="res-lamina-img" alt="">
        <figcaption><span id="res-lamina-pie"></span><button type="button" id="res-lamina-cerrar" aria-label="Cerrar la lámina">✕</button></figcaption>
      </figure>
    </div>
  </section>

  <!-- ══ UNIDADES ══ -->
  <section id="unidades" class="bloque unidades" data-screen-label="Unidades">
    <div class="centrado">
      <p class="rotulo" data-t="unidades.rotulo"></p>
      <h2 class="titulo partir" data-t="unidades.titulo"></h2>
      <p class="parrafo" data-t="unidades.texto"></p>
    </div>
    <div class="torres">
      <div class="torre" data-torre="Norte"><h3 data-t="torre.norte"></h3><div class="pisos" id="pisos-norte"></div></div>
      <div class="torre" data-torre="Sur"><h3 data-t="torre.sur"></h3><div class="pisos" id="pisos-sur"></div></div>
    </div>
    <div class="leyenda">
      <span><i class="libre"></i><b data-t="estado.libre"></b></span>
      <span><i class="reservada"></i><b data-t="estado.reservada"></b></span>
      <span><i class="vendida"></i><b data-t="estado.vendida"></b></span>
    </div>
    <p class="nota" data-t="unidades.nota"></p>
  </section>

  <!-- ══ ESPACIOS: partida, foto + panel terracota con la palabra grande ══ -->
  <section id="vida" class="partida" data-screen-label="Espacios">
    <div class="partida-foto"><img class="parallax" src="../../img/pasillo-verde.jpg" alt="" loading="lazy"></div>
    <div class="partida-panel partida-terracota">
      <p class="rotulo" data-t="espacios.rotulo"></p>
      <h2 class="partida-titulo partir" data-t="espacios.titulo"></h2>
      <ul class="partida-lista">
        <li data-t="espacios.i1"></li><li data-t="espacios.i2"></li><li data-t="espacios.i3"></li><li data-t="espacios.i4"></li>
      </ul>
      <div class="partida-palabra" data-t="espacios.palabra" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ══ COCHERAS: partida invertida, panel crema ══ -->
  <section id="cocheras" class="partida invertida" data-screen-label="Cocheras">
    <div class="partida-foto"><img class="parallax" src="../../img/cochera-bloque.jpg" alt="" loading="lazy" style="object-position:42% 50%"></div>
    <div class="partida-panel partida-crema">
      <p class="rotulo" data-t="cocheras.rotulo"></p>
      <h2 class="partida-titulo partir" data-t="cocheras.titulo"></h2>
      <ul class="partida-lista">
        <li data-t="cocheras.i1"></li><li data-t="cocheras.i2"></li><li data-t="cocheras.i3"></li>
      </ul>
      <div class="partida-palabra" data-t="cocheras.palabra" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ══ ADENTRO: el marco enmascarado que se abre al scrollear. Hoy pasa los
       renders con un paneo lento; cuando haya video de obra, va acá mismo. ══ -->
  <section id="adentro" class="adentro" data-screen-label="Adentro">
    <div class="adentro-cab">
      <p class="rotulo rotulo-claro" data-t="adentro.rotulo"></p>
      <h2 class="titulo partir" data-t="adentro.titulo"></h2>
      <p class="parrafo" data-t="adentro.texto"></p>
    </div>
    <div class="adentro-marco" id="adentro-marco">
      <img class="adentro-img" src="../../img/area-estar.jpg" alt="" loading="lazy">
      <img class="adentro-img" src="../../img/area-cocina.jpg" alt="" loading="lazy">
      <img class="adentro-img" src="../../img/area-suite.jpg" alt="" loading="lazy">
      <img class="adentro-img" src="../../img/area-terraza.jpg" alt="" loading="lazy">
      <div class="adentro-pie">
        <div><h3 id="adentro-t"></h3><p id="adentro-p"></p></div>
        <div class="adentro-puntos" id="adentro-puntos" role="tablist"></div>
      </div>
    </div>
  </section>

  <!-- ══ 3D ══ -->
  <section id="tresd" class="bloque tresd" data-screen-label="3D">
    <div class="centrado">
      <p class="rotulo" data-t="tresD.rotulo"></p>
      <h2 class="titulo partir" data-t="tresD.titulo"></h2>
      <p class="parrafo" data-t="tresD.texto"></p>
    </div>
    <div class="tresd-marco" id="tresd-marco">
      <button type="button" class="tresd-arrancar" id="tresd-arrancar"><span data-t="tresD.abrir"></span><small data-t="tresD.peso"></small></button>
    </div>
  </section>

  <!-- ══ DESDE ARRIBA ══ -->
  <section id="arriba" class="bloque bloque-dos invertido" data-screen-label="Desde arriba">
    <div class="bloque-media"><img src="../../img/esquema-torres.jpg" alt="" loading="lazy" class="corte"></div>
    <div class="bloque-texto">
      <p class="rotulo" data-t="desdeArriba.rotulo"></p>
      <h2 class="titulo partir" data-t="desdeArriba.titulo"></h2>
      <p class="parrafo" data-t="desdeArriba.texto"></p>
      <div class="ab" role="group">
        <button type="button" class="ab-btn" data-ab="norte" aria-pressed="true" data-t="torre.norte"></button>
        <button type="button" class="ab-btn" data-ab="sur" aria-pressed="false" data-t="torre.sur"></button>
      </div>
      <p class="ab-texto" id="ab-texto"></p>
    </div>
  </section>

  <!-- ══ UBICACIÓN ══ -->
  <section id="ubicacion" class="ubicacion" data-screen-label="Ubicación">
    <img class="ubicacion-fondo parallax" src="../../img/render-ascenso.jpg" alt="" loading="lazy">
    <div class="ubicacion-texto">
      <p class="rotulo rotulo-claro" data-t="ubicacion.rotulo"></p>
      <h2 class="titulo partir" data-t="ubicacion.titulo"></h2>
      <p class="parrafo" data-t="ubicacion.texto"></p>
      <ul class="cerca">
        <li><b>600 m</b><span data-t="ubicacion.shopping"></span></li>
        <li><b>700 m</b><span data-t="ubicacion.paseo"></span></li>
        <li><b>700 m</b><span data-t="ubicacion.hospital"></span></li>
      </ul>
      <a class="boton boton-linea boton-claro" target="_blank" rel="noreferrer" href="https://www.google.com/maps/search/?api=1&query=Aniceto+Latorre+y+Balcarce,+Salta,+Argentina" data-t="ubicacion.maps"></a>
    </div>
  </section>

  <!-- ══ PLAN DE PAGO ══ -->
  <section id="plan" class="bloque plan" data-screen-label="Plan de pago">
    <div class="centrado">
      <p class="rotulo" data-t="plan.rotulo"></p>
      <h2 class="titulo partir" data-t="plan.titulo"></h2>
      <p class="parrafo" data-t="plan.texto"></p>
    </div>
    <ol class="pasos">
      <li><span>01</span><h3 data-t="plan.anticipo.t"></h3><p data-t="plan.anticipo.p"></p></li>
      <li><span>02</span><h3 data-t="plan.cuotas.t"></h3><p data-t="plan.cuotas.p"></p></li>
      <li><span>03</span><h3 data-t="plan.posesion.t"></h3><p data-t="plan.posesion.p"></p></li>
    </ol>
  </section>

  <!-- ══ AVANCE ══ -->
  <section id="avance" class="bloque avance" data-screen-label="Avance de obra">
    <div class="centrado">
      <p class="rotulo" data-t="avance.rotulo"></p>
      <h2 class="titulo partir" data-t="avance.titulo"></h2>
      <p class="parrafo" data-t="avance.texto"></p>
    </div>
    <p class="nota" data-t="avance.sinFotos"></p>
  </section>

  <!-- ══ CONTACTO ══ -->
  <section id="contacto" class="bloque contacto" data-screen-label="Contacto">
    <div class="contacto-texto">
      <p class="rotulo" data-t="contacto.rotulo"></p>
      <h2 class="titulo partir" data-t="contacto.titulo"></h2>
      <p class="parrafo" data-t="contacto.texto"></p>
      <div class="firma">
        <img src="../../img/logo-molins.png" alt="" width="56" height="56" loading="lazy">
        <div><b>Francisco Molins</b><span data-t="pie.comercializa"></span><span>CUCIS 251 · 387 415 3669</span></div>
      </div>
      <a class="boton boton-wa" target="_blank" rel="noreferrer" id="wa-contacto" href="#"><span data-t="cta.whatsapp"></span></a>
    </div>
    <form class="form" id="form" novalidate>
      <label><span data-t="contacto.nombre"></span><input name="nombre" required minlength="2" autocomplete="name"></label>
      <label><span data-t="contacto.telefono"></span><input name="telefono" type="tel" required minlength="6" autocomplete="tel"></label>
      <label><span data-t="contacto.unidad"></span><select name="unidad" id="form-unidad"></select></label>
      <label><span data-t="contacto.mensaje"></span><textarea name="mensaje" rows="3"></textarea></label>
      <input name="empresa" tabindex="-1" autocomplete="off" class="trampa" aria-hidden="true">
      <button type="submit" class="boton boton-lleno" id="form-enviar" data-t="contacto.enviar"></button>
      <p class="form-aviso" id="form-aviso" hidden></p>
      <p class="form-pie" data-t="contacto.pie"></p>
    </form>
  </section>

</main>

<footer class="pie">
  <div class="pie-grid">
    <div class="pie-marca">
      <div class="marca">LA TORRE</div>
      <p data-t="pie.bajada"></p>
      <a target="_blank" rel="noreferrer" id="wa-pie" href="#" class="pie-wa"><span data-t="cta.whatsapp"></span></a>
    </div>
    <nav class="pie-col"><h4 data-t="pie.edificio"></h4><a href="#diseno" data-t="nav.diseno"></a><a href="#tipologias" data-t="nav.tipologias"></a><a href="#unidades" data-t="nav.unidades"></a><a href="#avance" data-t="nav.avance"></a></nav>
    <nav class="pie-col"><h4 data-t="pie.donde"></h4><a href="#ubicacion" data-t="nav.ubicacion"></a><a target="_blank" rel="noreferrer" href="https://www.google.com/maps/search/?api=1&query=Aniceto+Latorre+y+Balcarce,+Salta,+Argentina" data-t="ubicacion.maps"></a></nav>
    <div class="pie-col"><h4 data-t="pie.quien"></h4>
      <div class="pie-firma"><img src="../../img/logo-molins.png" alt="" width="40" height="40" loading="lazy"><span>Francisco Molins<small>Molins Negocios Inmobiliarios</small></span></div>
      <span class="pie-lpz"><small data-t="pie.comercializa"></small><img src="../../img/logo-lpz.png" alt="Grupo LPZ-Molins · CUCIS 251" width="86" height="106" loading="lazy"></span>
    </div>
  </div>
  <div class="pie-abajo"><span>© 2026 Edificio La Torre · Salta Capital</span><span data-t="pie.aviso"></span></div>
</footer>

<a class="wa-flotante" id="wa-flotante" target="_blank" rel="noreferrer" href="#" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 0 0 1.51 5.26l-.999 3.648 3.978-1.052z"/></svg></a>

<div class="ficha-fondo" id="ficha-fondo" hidden></div>
<aside class="ficha" id="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-titulo" hidden>
  <button type="button" class="ficha-cerrar" id="ficha-cerrar" aria-label="Cerrar">✕</button>
  <div class="ficha-media">
    <img id="ficha-img" alt="">
    <div class="ficha-vistas" role="tablist">
      <button type="button" data-vista="render" aria-selected="true" data-t="ficha.render"></button>
      <button type="button" data-vista="lamina" aria-selected="false" data-t="ficha.lamina"></button>
    </div>
  </div>
  <div class="ficha-cuerpo">
    <p class="rotulo" id="ficha-torre"></p>
    <h3 class="ficha-titulo" id="ficha-titulo"></h3>
    <span class="ficha-estado" id="ficha-estado"></span>
    <dl class="ficha-datos">
      <div><dt data-t="ficha.tipologia"></dt><dd id="ficha-tip"></dd></div>
      <div><dt data-t="ficha.superficie"></dt><dd id="ficha-sup"></dd></div>
      <div><dt data-t="ficha.ambientes"></dt><dd id="ficha-amb"></dd></div>
      <div><dt data-t="ficha.piso"></dt><dd id="ficha-piso"></dd></div>
    </dl>
    <p class="ficha-nota" id="ficha-nota"></p>
    <div class="ficha-ctas">
      <a class="boton boton-wa" target="_blank" rel="noreferrer" id="ficha-wa" href="#"><span data-t="cta.whatsapp"></span></a>
      <button type="button" class="boton boton-lleno" id="ficha-consultar" data-t="ficha.consultar"></button>
    </div>
  </div>
</aside>

<div class="cookies" id="cookies" role="region" aria-label="Aviso de cookies" hidden>
  <p data-t-html="cookies.texto"></p>
  <button type="button" id="cookies-ok" data-t="cookies.boton"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
<script src="app.js?v=202609031422"></script>
</body>
</html>
